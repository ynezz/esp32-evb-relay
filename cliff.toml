[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Only vX.Y.Z(-rc.N) tags are release boundaries. Excludes the cli/vX.Y.Z
# tags pushed by release-published.yml (see C5) so the CLI's own Go-module
# tags never get mistaken for changelog releases.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+.*$'
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^ci", group = "CI/CD" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build System" },
  { message = "^chore", skip = true },
]
sort_commits = "oldest"

[bump]
# Explicit 1.x semver semantics for `git-cliff --bumped-version`: feat -> minor,
# fix/other conventional types -> patch, breaking (`!` or BREAKING CHANGE:) -> major.
# Both keys already default to true in git-cliff, pinned here so the policy
# doesn't silently change if the upstream default ever flips.
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v1.0.0-rc.1"
