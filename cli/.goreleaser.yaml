version: 2

project_name: evb-relay

builds:
  - dir: cli
    main: .
    binary: evb-relay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X example.com/esp32-evb-relay/cli/cmd.Version={{ .Version }}
        -X example.com/esp32-evb-relay/cli/cmd.Commit={{ .Commit }}
        -X example.com/esp32-evb-relay/cli/cmd.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

release:
  draft: true
  prerelease: auto

changelog:
  disable: true
