name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      cli: ${{ steps.filter.outputs.cli }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            firmware:
              - 'firmware/**'
            cli:
              - 'cli/**'
            shared:
              - '.github/workflows/**'
              - 'cli/.goreleaser.yaml'
              - 'cliff.toml'

  firmware-build:
    name: firmware build
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build firmware and log size reports
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32
          path: firmware
          command: idf.py build size size-components size-files

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-esp32
          if-no-files-found: error
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/*.map
            firmware/build/flasher_args.json
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin

  firmware-test:
    name: firmware host test
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run firmware host tests
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32
          path: firmware
          command: >-
            python -m pip install pytest requests pyserial &&
            cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Debug
            -DENABLE_SANITIZERS=ON && cmake --build test/build &&
            cd test/build && ctest --output-on-failure &&
            cd ../.. &&
            python -m pytest -p no:cacheprovider
            test_integration/test_serial_bootloader_config.py

  cli-lint:
    name: cli lint
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          working-directory: cli
          args: --timeout=5m

  cli-test:
    name: cli test
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run CLI tests
        working-directory: cli
        run: go test -race -coverprofile=coverage.out ./...

  cli-build:
    name: cli build
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        working-directory: cli
        run: go build -o /dev/null .
